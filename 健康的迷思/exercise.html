<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3ef" />
    <title>锻炼计划</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --bg: #eef3ef;
        --panel: #ffffff;
        --ink: #1f2728;
        --muted: #65716f;
        --line: #d3ddd6;
        --blue: #315f8d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }

      main {
        width: min(720px, 100%);
        margin: 0 auto;
      }

      a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 700;
      }

      .card {
        margin-top: 18px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        letter-spacing: 0;
      }

      p,
      li {
        color: var(--muted);
        line-height: 1.75;
      }

      ul {
        margin: 14px 0 0;
        padding-left: 20px;
      }

      @media (max-width: 560px) {
        body {
          padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
        }

        .card {
          padding: 18px;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a href="./home.html">返回首页</a>
      <section class="card">
        <h1>锻炼</h1>
        <p>这里会放一三五游泳、二四哑铃、腰椎康复、膝盖保养和主动恢复。下一步我们把训练表做成可执行卡片。</p>
        <ul>
          <li>一三五：游泳为主。</li>
          <li>二四：哑铃力量和 McGill Big 3。</li>
          <li>周末：恢复、拉伸、呼吸和散步。</li>
        </ul>
      </section>
    </main>
    <script src="./pwa.js"></script>
  </body>
</html>
