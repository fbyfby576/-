<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3ef" />
    <title>健康的迷思</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <style>
      :root {
        color-scheme: light;
        --bg: #eef3ef;
        --panel: #ffffff;
        --ink: #1f2728;
        --muted: #65716f;
        --line: #d3ddd6;
        --green: #2f6f5e;
        --blue: #315f8d;
        --red: #a54840;
        --gold: #a87828;
        --soft-green: #e5f0e8;
        --soft-blue: #e6eef7;
        --soft-red: #f4e7e2;
        --shadow: 0 18px 42px rgba(28, 48, 43, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }

      .shell {
        width: min(1080px, 100%);
        margin: 0 auto;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 18px;
        padding: 20px 0 18px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--gold);
        font-size: 13px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 36px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .hero p {
        max-width: 620px;
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .status-card {
        min-width: 184px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .status-card span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .status-card strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
      }

      .entry-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .entry-card {
        display: grid;
        align-content: space-between;
        min-height: 280px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        text-decoration: none;
        box-shadow: var(--shadow);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .entry-card:focus-visible {
        outline: 3px solid rgba(49, 95, 141, 0.35);
        outline-offset: 3px;
      }

      .entry-mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 8px;
        color: white;
        font-size: 24px;
        font-weight: 800;
      }

      .entry-card h2 {
        margin: 22px 0 10px;
        font-size: 28px;
        letter-spacing: 0;
      }

      .entry-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .entry-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 22px;
      }

      .entry-meta span {
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
      }

      .meal .entry-mark {
        background: var(--green);
      }

      .training .entry-mark {
        background: var(--blue);
      }

      .practice .entry-mark {
        background: var(--red);
      }

      .meal .entry-meta span {
        background: var(--soft-green);
        color: var(--green);
      }

      .training .entry-meta span {
        background: var(--soft-blue);
        color: var(--blue);
      }

      .practice .entry-meta span {
        background: var(--soft-red);
        color: var(--red);
      }

      .quick-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 14px;
      }

      .quick-link {
        min-height: 86px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        text-decoration: none;
      }

      .quick-link strong,
      .quick-link span {
        display: block;
      }

      .quick-link span {
        margin-top: 6px;
        color: var(--muted);
        line-height: 1.5;
      }

      @media (max-width: 860px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .status-card {
          min-width: 0;
        }

        .entry-grid {
          grid-template-columns: 1fr;
        }

        .entry-card {
          min-height: 196px;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
        }

        .hero {
          padding-top: 10px;
        }

        h1 {
          font-size: 30px;
        }

        .hero p {
          font-size: 15px;
        }

        .entry-card {
          min-height: 176px;
          padding: 18px;
        }

        .entry-mark {
          width: 48px;
          height: 48px;
          font-size: 22px;
        }

        .entry-card h2 {
          margin-top: 18px;
          font-size: 24px;
        }

        .quick-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">健康的迷思</p>
          <h1>把生活拆成三件事</h1>
          <p>先吃得稳定，再练得安全，最后把注意力和睡眠慢慢养回来。</p>
        </div>
        <aside class="status-card" aria-label="当前目标">
          <span>当前阶段</span>
          <strong>减脂到 74kg</strong>
        </aside>
      </header>

      <section class="entry-grid" aria-label="主功能入口">
        <a class="entry-card meal" href="./meal-planner.html">
          <div>
            <div class="entry-mark">食</div>
            <h2>菜谱</h2>
            <p>年度菜单、买菜日计划、外食规则、备餐和购物清单。</p>
          </div>
          <div class="entry-meta">
            <span>8周轮换</span>
            <span>周四买菜</span>
          </div>
        </a>

        <a class="entry-card training" href="./exercise.html">
          <div>
            <div class="entry-mark">动</div>
            <h2>锻炼</h2>
            <p>游泳、哑铃、腰椎康复和低冲击心肺，围绕安全执行。</p>
          </div>
          <div class="entry-meta">
            <span>一三五游泳</span>
            <span>二四力量</span>
          </div>
        </a>

        <a class="entry-card practice" href="./practice.html">
          <div>
            <div class="entry-mark">静</div>
            <h2>修行</h2>
            <p>睡眠、呼吸、站桩、复盘和注意力训练，给系统降噪。</p>
          </div>
          <div class="entry-meta">
            <span>呼吸</span>
            <span>复盘</span>
          </div>
        </a>
      </section>

      <nav class="quick-row" aria-label="辅助入口">
        <a class="quick-link" href="./index.html">
          <strong>综合面板</strong>
          <span>查看原来的健康总览、补剂和每日执行追踪。</span>
        </a>
        <a class="quick-link" href="./DEPLOY_MOBILE.md">
          <strong>手机部署</strong>
          <span>查看手机访问和 PWA 安装说明。</span>
        </a>
      </nav>
    </main>
    <script src="./pwa.js"></script>
  </body>
</html>
