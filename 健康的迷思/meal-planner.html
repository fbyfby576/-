<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3ef" />
    <title>年度菜谱原型</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./meal-planner.css" />
  </head>
  <body>
    <main class="meal-app">
      <aside class="rail">
        <div class="identity">
          <p>年度菜谱原型</p>
          <h1>丰富版控糖菜单</h1>
          <span>78kg 到 73.5kg，再增肌。页面先服务每天执行：今日菜单、今日补剂、本周购物。</span>
        </div>

        <section class="score-grid" aria-label="饮食目标">
          <article>
            <span>蛋白</span>
            <strong>120g</strong>
            <small>每日起步目标</small>
          </article>
          <article>
            <span>目标</span>
            <strong>73.5kg</strong>
            <small>先减脂，再增肌</small>
          </article>
          <article>
            <span>鱼类</span>
            <strong>2-3次</strong>
            <small>低汞高脂鱼优先</small>
          </article>
          <article>
            <span>晚餐</span>
            <strong>低碳</strong>
            <small>蛋白 + 双蔬菜</small>
          </article>
        </section>

        <section class="rule-card">
          <h2>固定规则</h2>
          <ul>
            <li>每餐顺序：蔬菜、蛋白质、主食。</li>
            <li>鱼每周 2-3 次即可；其余蛋白用蛋、牛肉、鸡肉、虾、豆腐、豆类轮换。</li>
            <li>钙类用无糖高钙豆浆、无乳糖酸奶或钙盐豆腐，不用普通牛奶硬扛。</li>
            <li>周六晚餐放纵，放纵前先吃一份蛋白和蔬菜。</li>
          </ul>
        </section>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div class="control-group" aria-label="月份选择">
            <label for="monthSelect">月份</label>
            <select id="monthSelect"></select>
          </div>
          <div class="control-group" aria-label="周次选择">
            <label for="weekSelect">轮换周</label>
            <select id="weekSelect"></select>
          </div>
        </header>

        <nav class="day-tabs" id="dayTabs" aria-label="每日菜单"></nav>

        <section class="day-board">
          <article class="meal-column">
            <p class="eyebrow">今日菜单</p>
            <h2 id="dayTitle"></h2>
            <div class="meal-list" id="mealList"></div>
          </article>
        </section>

        <section class="panel supplement-panel">
          <div class="panel-head">
            <p class="eyebrow">今日补剂</p>
            <h2 id="supplementTitle"></h2>
          </div>
          <div class="supplement-list today-only" id="todaySupplements"></div>
        </section>

        <section class="panel shopping-section">
          <div class="panel-head">
            <p class="eyebrow">本周购物</p>
            <h2>照着买就好</h2>
          </div>
          <div class="shopping-list" id="shoppingList"></div>
        </section>

        <section class="month-band month-panel">
          <div>
            <p class="eyebrow">当月食材包</p>
            <h2 id="monthTitle"></h2>
          </div>
          <div class="season-tags" id="seasonTags"></div>
        </section>
      </section>
    </main>

    <script src="./pwa.js"></script>
    <script src="./meal-planner.js"></script>
  </body>
</html>
